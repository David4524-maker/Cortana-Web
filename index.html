<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortana Web</title>
  <style>
    :root {
      --cortana-black: #111111;
      --sidebar-bg: #1f1f1f;
      --sidebar-active: #0078d7;
      --cortana-blue: #00d8f6;
      --search-bg: #333333;
      --mic-bg: #0078d7;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Window Container */
    .cortana-container {
      width: 380px;
      height: 640px;
      background-color: var(--cortana-black);
      display: grid;
      grid-template-columns: 48px 1fr;
      grid-template-rows: 1fr 44px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Collapsible Left Sidebar (Overlay Drawer) */
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 44px;
      width: 48px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 8px;
      z-index: 20;
      transition: width 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .sidebar.expanded {
      width: 200px;
    }

    .sidebar-btn {
      width: 200px;
      height: 48px;
      display: flex;
      align-items: center;
      padding-left: 15px;
      gap: 16px;
      color: var(--text-main);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .sidebar-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .sidebar-btn.active {
      background-color: var(--sidebar-active);
    }

    .sidebar-btn svg {
      min-width: 18px;
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-text {
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    .sidebar.expanded .nav-text {
      opacity: 1;
      visibility: visible;
    }

    /* Main Area */
    .main-stage {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 35px 18px 18px 18px;
      position: relative;
      overflow-y: auto;
    }

    /* Language Menu Selector Popup */
    .lang-menu {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .lang-menu.show {
      display: flex;
    }

    .lang-menu label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .lang-menu select {
      background: #111;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* Halo Area */
    .halo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
      cursor: pointer;
    }

    .halo-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 5px solid var(--cortana-blue);
      box-shadow: 0 0 12px var(--cortana-blue);
      transition: all 0.3s ease;
      position: relative;
    }

    /* Halo Animations */
    .halo-container.idle .halo-ring {
      animation: ringPulse 3s infinite ease-in-out;
    }

    .halo-container.listening .halo-ring {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 20px #ffffff;
      animation: listenPulse 0.8s infinite alternate ease-in-out;
    }

    .halo-container.speaking .halo-ring {
      animation: speakRipple 0.4s infinite alternate ease-in-out;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes listenPulse {
      from { transform: scale(1.1); }
      to { transform: scale(1.22); }
    }

    @keyframes speakRipple {
      from { transform: scale(0.95); border-width: 3px; }
      to { transform: scale(1.1); border-width: 7px; }
    }

    /* Greeting Text */
    .greeting {
      margin-top: 14px;
      font-size: 19px;
      color: var(--cortana-blue);
      font-weight: 300;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Dots Indicator */
    .dots {
      margin-top: 4px;
      color: var(--cortana-blue);
      font-size: 16px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    /* Chat Messages Container */
    .chat-box {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .msg {
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 2px;
      max-width: 92%;
    }

    .msg.cortana {
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid var(--cortana-blue);
      color: #e0e0e0;
      align-self: flex-start;
    }

    .msg.user {
      background: var(--sidebar-active);
      color: #ffffff;
      align-self: flex-end;
    }

    /* Bottom Windows Taskbar Area */
    .taskbar {
      grid-column: 1 / -1;
      background-color: #000000;
      display: flex;
      align-items: center;
      z-index: 30;
    }

    /* Windows Start Icon */
    .win-btn {
      width: 48px;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .win-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .win-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    /* Search Input Box */
    .search-box {
      flex: 1;
      height: 100%;
      background-color: var(--search-bg);
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13.5px;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* Mic Button */
    .mic-btn {
      width: 48px;
      height: 100%;
      background-color: var(--mic-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .mic-btn:hover {
      background-color: #005a9e;
    }

    .mic-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }
  </style>
</head>

    let currentLang = 'es';

    // DOM Elements
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const mainStage = document.getElementById('mainStage');
    const searchInput = document.getElementById('searchInput');
    const greetingText = document.getElementById('greetingText');
    const haloContainer = document.getElementById('haloContainer');
    const micBtn = document.getElementById('micBtn');
    const chatBox = document.getElementById('chatBox');
    const langSelect = document.getElementById('langSelect');
    const btnSettings = document.getElementById('btnSettings');
    const langMenu = document.getElementById('langMenu');

    // Sidebar Text Labels
    const lblMenu = document.getElementById('lblMenu');
    const lblHome = document.getElementById('lblHome');
    const lblNotebook = document.getElementById('lblNotebook');
    const lblTips = document.getElementById('lblTips');
    const lblSettings = document.getElementById('lblSettings');

    // Sidebar Toggle
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      sidebar.classList.toggle('expanded');
    });

    mainStage.addEventListener('click', () => {
      sidebar.classList.remove('expanded');
      langMenu.classList.remove('show');
    });

    // Speech Recognition
    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        setHaloState('listening', uiLang[currentLang].listening);
      };

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        searchInput.value = text;
        processQuery(text);
      };

      recognition.onerror = () => {
        setHaloState('idle', uiLang[currentLang].greeting);
      };

      recognition.onend = () => {
        if (!synth.speaking && haloContainer.classList.contains('listening')) {
          setHaloState('idle', uiLang[currentLang].greeting);
        }
      };
    }

    function updateLanguage(lang) {
      currentLang = lang;
      const dict = uiLang[lang];

      searchInput.placeholder = dict.placeholder;
      greetingText.textContent = dict.greeting;

      lblMenu.textContent = dict.navMenu;
      lblHome.textContent = dict.navHome;
      lblNotebook.textContent = dict.navNotebook;
      lblTips.textContent = dict.navTips;
      lblSettings.textContent = dict.navSettings;

      if (recognition) recognition.lang = dict.langCode;
    }

    langSelect.addEventListener('change', (e) => {
      updateLanguage(e.target.value);
      langMenu.classList.remove('show');
      sidebar.classList.remove('expanded');
    });

    btnSettings.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('show');
    });

    function setHaloState(state, text) {
      haloContainer.className = `halo-container ${state}`;
      if (text) greetingText.textContent = text;
    }

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speak(text) {
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = uiLang[currentLang].langCode;
      
      const voices = synth.getVoices();
      const matchVoice = voices.find(v => v.lang.startsWith(currentLang));
      if (matchVoice) utterance.voice = matchVoice;

      utterance.onstart = () => setHaloState('speaking', text);
      utterance.onend = () => setHaloState('idle', uiLang[currentLang].greeting);

      synth.speak(utterance);
    }

    // Dynamic Engine to match query against Q&A Knowledge Base
    function processQuery(query) {
      if (!query.trim()) return;

      appendMessage('user', query);
      searchInput.value = '';
      setHaloState('thinking', uiLang[currentLang].thinking);

      const q = query.toLowerCase().trim();
      let reply = "";

      // Check System Utilities (Time, Date, Math)
      if (q.includes("hora") || q.includes("time")) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        reply = currentLang === 'es' ? `Son las ${timeStr}.` : (currentLang === 'pt' ? `São ${timeStr}.` : `The time is ${timeStr}.`);
      } else if (q.includes("fecha") || q.includes("date") || q.includes("dia es hoy")) {
        const dateStr = new Date().toLocaleDateString();
        reply = currentLang === 'es' ? `Hoy es ${dateStr}.` : (currentLang === 'pt' ? `Hoje é ${dateStr}.` : `Today is ${dateStr}.`);
      } else if (q.match(/[0-9]+\s*[\+\-\*\/]\s*[0-9]+/)) {
        try {
          const res = eval(q.replace(/[^0-9\+\-\*\/\.]/g, ''));
          reply = currentLang === 'es' ? `El resultado es ${res}.` : (currentLang === 'pt' ? `O resultado é ${res}.` : `The answer is ${res}.`);
        } catch (e) {
          reply = "Math error.";
        }
      } else {
        // Search Knowledge Base for Intent Matching
        const kb = cortanaKnowledgeBase[currentLang] || cortanaKnowledgeBase['es'];
        const match = kb.find(item => item.keys.some(k => q.includes(k)));

        if (match) {
          if (match.random) {
            reply = match.random[Math.floor(Math.random() * match.random.length)];
          } else {
            reply = match.reply;
          }
        } else {
          // Default Fallback
          if (currentLang === 'es') reply = `He encontrado esto en la web sobre "${query}".`;
          else if (currentLang === 'pt') reply = `Aqui está o que encontrei sobre "${query}".`;
          else reply = `Here is what I found for "${query}".`;
        }
      }

      setTimeout(() => {
        appendMessage('cortana', reply);
        speak(reply);
      }, 550);
    }

    // Events
    // Evita que el clic dentro del menú se propague al fondo y lo cierre
langMenu.addEventListener('click', (e) => {
  e.stopPropagation();
});

    const triggerVoice = () => {
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    };

    micBtn.addEventListener('click', triggerVoice);
    haloContainer.addEventListener('click', triggerVoice);

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => synth.getVoices();
    }

    // Initial Start
    updateLanguage('es');
  </script>
</body>
</html>
